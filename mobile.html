<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>八卦对决 · 手机</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="app" class="mobile">
    <header class="topbar">
      <div class="brand">八卦对决 <span>BAGUA DUEL</span></div>
      <div class="seatbar" id="seatbar"></div>
      <div class="status" id="status">未入座</div>
      <div class="topactions">
        <button id="btnRules">规则</button>
        <button id="btnEnd" disabled>结束</button>
      </div>
    </header>

    <main class="stage">
      <section class="arena">
        <canvas id="fx" aria-hidden="true"></canvas>
        <div class="figure opp" id="oppFigure"></div>
        <div class="boardwrap">
          <div class="dili">地利</div>
          <div class="board" id="board"></div>
        </div>
        <div class="figure me" id="myFigure"></div>
        <div class="prompt" id="prompt"></div>
      </section>

      <section class="mbody">
        <div class="previewPanel" id="previewPanel"></div>
        <div class="mpanel">
          <div class="panelhead">人物牌 · 4 属性 × 8 家庭成员</div>
          <div class="rosterhead" id="rosterHead"></div>
          <div class="roster" id="roster"></div>
        </div>
        <div class="mpanel">
          <div class="panelhead">武器 · 手牌</div>
          <div class="weapons" id="weapons"></div>
        </div>
        <div class="mpanel">
          <div class="panelhead">八技能</div>
          <div class="skills" id="skills"></div>
        </div>
        <div class="myinfo" id="myInfo"></div>
        <div class="season" id="season"></div>
        <div class="mpanel historyPanel"><div class="history" id="history"></div></div>
      </section>
    </main>

    <div class="screens" id="screens"></div>
    <div class="termflash" id="termFlash"></div>
  </div>

  <script src="src/data.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
