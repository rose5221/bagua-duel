<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>八卦弈魂 · 手机</title>
  <link rel="stylesheet" href="styles.css?v=20261023aq">
  <link rel="stylesheet" href="mobile.css?v=20261023aq">
</head>
<body>
  <div id="app" class="mobile">
    <header class="topbar">
      <div class="brand">八卦弈魂 <span>BAGUA DUEL</span></div>
      <div class="seatbar" id="seatbar"></div>
      <div class="status" id="status">未入座</div>
      <div class="topactions"><button id="btnRules">规则</button><button id="btnPause" title="菜单 / 暂停">菜单</button>
        <button id="btnEnd" disabled>结束</button></div>
    </header>

    <main class="stage">
      <section class="arena">
        <canvas id="fx" aria-hidden="true"></canvas>
        <div class="opppublic" id="oppPublic"></div>
        <div class="boardwrap">
          <div class="dili">地利</div>
          <div class="board" id="board"></div>
        </div>
        <div class="figure me" id="myFigure"></div>
        <div class="prompt" id="prompt"></div>
      </section>

      <section class="mbody">
        <div class="previewPanel" id="previewPanel"></div>
        <div class="mpanel charPanel"><div class="panelhead">角色 · 道童</div><div class="charskills" id="charSkills"></div></div>
        <div class="handwrap">
          <div class="handhead" id="handHead"></div>
          <div class="hand" id="hand"></div>
        </div>
        <div class="mpanel"><div class="panelhead">武器 · 手牌</div><div class="weapons" id="weapons"></div></div>
        <div class="mpanel"><div class="panelhead">八技能 · 每张整局 2 次</div><div class="skills" id="skills"></div></div>
        <div class="myinfo" id="myInfo"></div>
        <div class="season" id="season"></div>
        <div class="mpanel historyPanel"><div class="history" id="history"></div></div>
      </section>
    </main>

    <div class="screens" id="screens"></div>
    <div class="combobanner" id="comboBanner"></div>
    <div class="termflash" id="termFlash"></div>
  </div>

  <script src="src/data.js?v=20261023aq"></script>
  <script src="src/meta.js?v=20261023aq"></script>
  <script src="src/blessings.js?v=20261023aq"></script>
  <script src="src/campaign.js?v=20261023aq"></script>
  <script src="src/engine.js?v=20261023aq"></script>
  <script src="src/ai.js?v=20261023aq"></script>
  <script src="src/ui.js?v=20261023aq"></script>
</body>
</html>
