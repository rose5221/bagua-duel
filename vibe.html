<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八卦弈魂 · 动画预告</title>
<style>
  @font-face { font-family:'FusionPixel'; src:url('assets/fonts/fusion-pixel-12px.woff2') format('woff2'); font-display:swap; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#050809; }
  body { font-family:'FusionPixel','PingFang SC',monospace; color:#f1ead8; }
  .stage { position:relative; width:1920px; height:1080px; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 40%, #223033 0%, #0b1112 35%, #050809 72%),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px);
  }
  .stars { position:absolute; inset:0; opacity:.55;
    background-image:radial-gradient(#d0ae58 1px,transparent 1px),radial-gradient(#6f9ca3 1px,transparent 1px);
    background-size:137px 91px,211px 173px; background-position:12px 30px,80px 90px;
    animation:drift 18s linear infinite;
  }
  .mountain { position:absolute; left:50%; top:5%; width:1500px; transform:translateX(-50%); opacity:.18; filter:contrast(1.15); }
  .vignette { position:absolute; inset:0; box-shadow:inset 0 0 220px 70px #000; pointer-events:none; }
  .board { position:absolute; left:50%; top:53%; width:700px; height:700px; transform:translate(-50%,-50%);
    animation:boardIn 2.4s cubic-bezier(.16,.8,.2,1) both, boardFloat 8s 2.4s ease-in-out infinite;
    filter:drop-shadow(0 0 45px rgba(208,174,88,.22));
  }
  .board img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
  .ring { position:absolute; left:50%; top:53%; width:780px; height:780px; transform:translate(-50%,-50%); border-radius:50%;
    border:1px solid rgba(208,174,88,.22); animation:ringPulse 3s 2.4s ease-in-out infinite;
  }
  .ring:before { content:''; position:absolute; inset:28px; border-radius:50%; border:1px dashed rgba(111,156,163,.18); }
  h1 { position:absolute; top:95px; left:50%; transform:translateX(-50%); margin:0; font-size:108px; font-weight:normal;
    letter-spacing:.16em; color:#fff9e8; white-space:nowrap;
    text-shadow:0 4px 0 #000,0 8px 0 #000,0 0 28px rgba(208,174,88,.35);
    animation:titleIn 1.8s steps(12,end) both;
  }
  h1:after { content:''; display:block; width:270px; height:4px; margin:18px auto 0; background:#c2a24c;
    box-shadow:0 4px 0 #000; animation:lineIn 1.4s 1.2s both; }
  .tagline { position:absolute; top:300px; left:50%; transform:translateX(-50%); font-size:28px; letter-spacing:.38em;
    color:#d9d0b9; white-space:nowrap; opacity:0; animation:fadeUp 1.4s 2.3s both; }
  .tagline b { color:#d0ae58; font-weight:normal; }
  .cards { position:absolute; left:50%; bottom:86px; transform:translateX(-50%); display:flex; gap:26px; align-items:flex-end; }
  .card { width:132px; height:178px; background:#e8dfc8; border:2px solid #0b0e0f; box-shadow:5px 5px 0 #000;
    transform-origin:50% 100%; opacity:0; animation:cardIn 1.2s cubic-bezier(.14,.75,.2,1) both; animation-delay:calc(1.6s + var(--i)*.12s);
  }
  .card img { width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
  .card:nth-child(odd) { transform:rotate(-4deg); }
  .card:nth-child(even) { transform:rotate(4deg); }
  .souls { position:absolute; left:50%; bottom:292px; transform:translateX(-50%); display:flex; align-items:center; gap:16px;
    opacity:0; animation:fadeUp 1s 2.7s both;
  }
  .soul { width:28px; height:28px; border-radius:50%; border:2px solid #8d6e3b; background:#171c1e; box-shadow:0 0 14px rgba(208,174,88,.3); }
  .soul.lit { background:#d0ae58; animation:soulPulse 2s ease-in-out infinite; }
  .pips { display:flex; gap:7px; margin-left:8px; }
  .pips i { width:10px; height:10px; border-radius:50%; background:#6f9ca3; box-shadow:0 0 8px rgba(111,156,163,.4); }
  .pips i:nth-child(n+6) { background:#3c4a4c; }
  .caption { position:absolute; right:58px; bottom:48px; color:#6f9ca3; font-size:16px; letter-spacing:.2em; animation:fadeUp 1s 3.1s both; }
  .caption b { color:#d0ae58; font-weight:normal; }
  @keyframes boardIn { from { opacity:0; transform:translate(-50%,-50%) rotate(-24deg) scale(.55); } to { opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1); } }
  @keyframes boardFloat { 0%,100% { filter:drop-shadow(0 0 45px rgba(208,174,88,.22)); } 50% { filter:drop-shadow(0 0 75px rgba(208,174,88,.38)); } }
  @keyframes ringPulse { 0%,100% { opacity:.35; transform:translate(-50%,-50%) scale(.98); } 50% { opacity:.8; transform:translate(-50%,-50%) scale(1.02); } }
  @keyframes titleIn { 0% { opacity:0; letter-spacing:.5em; filter:blur(8px); } 60% { opacity:1; filter:blur(0); } 100% { opacity:1; letter-spacing:.16em; } }
  @keyframes lineIn { from { width:0; opacity:0; } to { width:270px; opacity:1; } }
  @keyframes fadeUp { from { opacity:0; transform:translate(-50%,14px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes cardIn { from { opacity:0; transform:translateY(50px) rotate(-12deg) scale(.8); } to { opacity:1; transform:translateY(0) rotate(0) scale(1); } }
  @keyframes soulPulse { 0%,100% { box-shadow:0 0 12px rgba(208,174,88,.45); } 50% { box-shadow:0 0 30px rgba(208,174,88,.95); } }
  @keyframes drift { to { background-position:149px 121px,291px 263px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="stars"></div>
  <img class="mountain" src="assets/pixel/scene/mountain.png" alt="">
  <div class="ring"></div>
  <div class="board"><img src="assets/pixel/table.png" alt=""></div>
  <h1>八卦弈魂</h1>
  <div class="tagline">八卦定阵 <b>·</b> 五行相生 <b>·</b> 三魂七魄</div>
  <div class="souls"><span class="soul lit"></span><span class="soul lit"></span><span class="soul lit"></span><span class="pips"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
  <div class="cards">
    <div class="card" style="--i:0"><img src="assets/art/cards-pixel/qian-fu.webp" alt=""></div>
    <div class="card" style="--i:1"><img src="assets/art/cards-pixel/li-zhongnv.webp" alt=""></div>
    <div class="card" style="--i:2"><img src="assets/art/cards-pixel/dui-shaonv.webp" alt=""></div>
    <div class="card" style="--i:3"><img src="assets/art/cards-pixel/zhen-changnan.webp" alt=""></div>
    <div class="card" style="--i:4"><img src="assets/art/cards-pixel/xun-changnv.webp" alt=""></div>
    <div class="card" style="--i:5"><img src="assets/art/cards-pixel/kan-zhongnan.webp" alt=""></div>
    <div class="card" style="--i:6"><img src="assets/art/cards-pixel/gen-shaonan.webp" alt=""></div>
    <div class="card" style="--i:7"><img src="assets/art/cards-pixel/kun-mu.webp" alt=""></div>
  </div>
  <div class="caption"><b>64</b> 张人物牌 · <b>9</b> 关剧情 · 竖屏像素卡牌</div>
  <div class="vignette"></div>
</div>
</body>
</html>
